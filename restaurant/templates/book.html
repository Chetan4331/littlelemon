{% extends 'base.html' %}
{% load static %}

{% block content %}
<section>
  <article>
    <h1>Make a reservation</h1>
    <div class="row">
      <!-- Booking Form -->
      <div class="column">
        <form action="" method="post" id="form">
          {% csrf_token %}
          <p>
            <label for="first_name">Name:</label>
            <input type="text" placeholder="Your Name" maxlength="200" required id="first_name">
          </p>
          <p>
            <label for="reservation_date">Reservation date:</label>
            <input type="date" id="reservation_date" required>
          </p>
          <p>
            <label for="reservation_slot">Reservation time:</label>
            <select id="reservation_slot">
              <option value="0" disabled>Select time</option>
            </select>
          </p>
          <button type="button" id="button">Reserve</button>
        </form>
      </div>

      <!-- Current Reservations for Selected Date -->
      <div class="column">
        <h2>Bookings For <span id="today"></span></h2>
        <div id="bookings">
        </div>
      </div>
    </div>
  </article>
</section>

<script>
  // Step 1: Auto-select current date on load
  const date = new Date()
  document.getElementById('reservation_date').value = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`

  // Initial fetch of bookings for current date
  getBookings()

  // Step 2: Refresh booking data whenever date changes
  document.getElementById('reservation_date').addEventListener('change', function () {
    getBookings()
  })

  // Format hour (10-20) into 12-hour AM/PM label
  function formatTime(time) {
    const ampm = time < 12 ? 'AM' : 'PM'
    const t = time < 12 ? time : time > 12 ? time - 12 : time
    return `${t} ${ampm}`
  }

  // Step 3: Fetch bookings using fetch API and update UI & slot availability
  function getBookings() {
    let reserved_slots = []
    const selectedDate = document.getElementById('reservation_date').value
    document.getElementById('today').innerText = selectedDate

    fetch("{% url 'bookings' %}" + "?date=" + selectedDate)
      .then(response => response.json())
      .then(data => {
        reserved_slots = []
        let bookingsHTML = ''

        // Process all bookings returned for the date
        for (const item of data) {
          reserved_slots.push(item.fields.reservation_slot)
          bookingsHTML += `<p>${item.fields.first_name} - ${formatTime(item.fields.reservation_slot)}</p>`
        }

        // Build slot options and disable already reserved slots
        let slot_options = '<option value="0" disabled selected>Select time</option>'
        for (let i = 10; i <= 20; i++) {
          const label = formatTime(i)
          if (reserved_slots.includes(i)) {
            slot_options += `<option value="${i}" class="booked" disabled>${label}</option>`
          } else {
            slot_options += `<option value="${i}">${label}</option>`
          }
        }

        document.getElementById('reservation_slot').innerHTML = slot_options

        // Display "No bookings" message if there are no reservations for this date
        if (bookingsHTML === '') {
          bookingsHTML = '<p>No bookings</p>'
        }
        document.getElementById('bookings').innerHTML = bookingsHTML
      })
      .catch(error => {
        console.error('Error fetching bookings:', error)
      })
  }

  // Step 4: Handle form submission via fetch API
  document.getElementById('button').addEventListener('click', function (e) {
    const firstName = document.getElementById('first_name').value.trim()
    const reservationDate = document.getElementById('reservation_date').value
    const reservationSlot = parseInt(document.getElementById('reservation_slot').value)

    if (!firstName) {
      alert("Please provide your name.")
      return
    }

    if (!reservationSlot || reservationSlot === 0) {
      alert("Please select an available reservation time slot.")
      return
    }

    const formdata = {
      first_name: firstName,
      reservation_date: reservationDate,
      reservation_slot: reservationSlot,
    }

    fetch("{% url 'bookings' %}", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formdata)
    })
      .then(response => {
        return response.json().then(data => ({ status: response.status, body: data }))
      })
      .then(result => {
        if (result.status === 200 || result.status === 201) {
          // Success: Refresh list and clear name
          getBookings()
          document.getElementById('first_name').value = ''
        } else {
          // Duplicate booking or error
          alert(result.body.message || "Duplicate booking: this slot is already reserved.")
        }
      })
      .catch(error => {
        console.error('Error saving reservation:', error)
      })
  })
</script>
{% endblock %}
